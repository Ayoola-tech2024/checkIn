<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Checkmark Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Badge Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)"/>

  <!-- Biometric Scanning Target Brackets -->
  <path d="M 128 176 L 128 144 C 128 135.163 135.163 128 144 128 L 176 128" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 336 128 L 368 128 C 376.837 128 384 135.163 384 144 L 384 176" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 128 336 L 128 368 C 128 376.837 135.163 384 144 384 L 176 384" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M 336 384 L 368 384 C 376.837 384 384 376.837 384 368 L 384 336" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- Biometric Circle Ring -->
  <circle cx="256" cy="256" r="110" stroke="url(#ringGrad)" stroke-width="14" fill="none" stroke-dasharray="520 80" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Face Node Points -->
  <circle cx="206" cy="216" r="8" fill="#38bdf8" opacity="0.8"/>
  <circle cx="306" cy="216" r="8" fill="#38bdf8" opacity="0.8"/>
  <circle cx="256" cy="240" r="7" fill="#6366f1" opacity="0.8"/>

  <!-- Central Verified Checkmark Badge -->
  <circle cx="256" cy="256" r="76" fill="#0f172a" opacity="0.85"/>
  <path d="M 212 258 L 244 290 L 304 222" stroke="url(#checkGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>
</svg>
